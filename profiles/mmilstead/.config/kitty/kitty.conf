# Font
font_family      DMMono Nerd Font
font_size        12

# Theme (pick one later with: kitten themes)
# include          current-theme.conf

# Layouts — enable splits so ctrl+shift+s works
enabled_layouts  splits,stack

# Shell
shell            /bin/zsh

# --- Keybindings ported from Ghostty ---

# close the focused split/window
map ctrl+shift+x close_window

# reset all splits to equal sizes
map ctrl+shift+equal layout_action rebalance

# split in the direction with more room (auto)
map ctrl+shift+s launch --location=split --cwd=current

# split into rows (new window below)
# overrides default: open_url_with_hints is on ctrl+shift+e; pass_selection_to_program on ctrl+shift+o
map ctrl+shift+o launch --location=vsplit --cwd=current

# split into columns (new window beside)
map ctrl+shift+e launch --location=hsplit --cwd=current

# move the focused split directionally
map ctrl+shift+alt+left  move_window left
map ctrl+shift+alt+right move_window right
map ctrl+shift+alt+up    move_window up
map ctrl+shift+alt+down  move_window down


# BEGIN_KITTY_THEME
# Bright Lights
include current-theme.conf
# END_KITTY_THEME